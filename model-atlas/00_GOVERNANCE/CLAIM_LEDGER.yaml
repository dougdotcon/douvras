- id: C-111
  statement: Um fine-tune LoRA pequeno (80 exemplos sinteticos, 1 epoca) em smollm2-360m-instruct nao
    produz ganho medido em structured_output, mesmo com dataset desenhado para ensinar a habilidade geral
    (dominios ausentes do corpus de avaliacao).
  status: CONJECTURE
  assumptions:
  - A-103
  - A-107
  evidence:
  - RUN:eval_360m_base_v2
  - RUN:eval_360m_tuned_v2
  falsifiers:
  - o mesmo dataset e receita em um modelo maior (smollm3-3b, se a RAM permitir) produzir ganho
  - um dataset maior ou mais epocas no mesmo modelo pequeno produzir ganho
  - um segundo caso independente de baixa tratabilidade aparente em structured_output
  owner: research
  last_reviewed: '2026-08-19'
  note: 'CONFUNDIDO por desenho, nao so por resultado: 360M e 80 exemplos/1 epoca foram escolhas forcadas
    por limite de RAM (LoRA em smollm3-3b nao completou nem 1 passo sem esgotar a memoria), nao um teste
    adequadamente dimensionado da tratabilidade real. Primeiro (1/3) caso de G-104, e o mais fraco possivel:
    um resultado nulo aqui nao diz se structured_output e pouco tratavel ou se o experimento era pequeno
    demais. NAO usar para ajustar o prior tractability=0.90 em capability_priors.v1.json — fazer isso
    seria reponderar o instrumento por um unico caso confundido, o erro que CE-001 do Silicon Atlas ja
    ensinou a nao repetir. Publicado so depois de corrigir G-120: a primeira leitura (100%) era exploit
    de grader, nao capacidade.'

- id: C-110
  statement: Ativar o modo de raciocinio (/think) num modelo hibrido melhora o escore agregado do BR-Agent-Bench,
    mas o efeito por capacidade nao e uniforme — algumas capacidades melhoram muito, outras pioram, e
    o numero de chamadas de ferramenta cai em vez de se manter igual.
  status: HYPOTHESIS
  assumptions:
  - A-103
  - A-107
  evidence:
  - RUN:smollm3-3b-think-agent-ptbr-v2
  falsifiers:
  - um segundo modelo de raciocinio hibrido cujo /think melhore TODAS as capacidades (efeito uniforme)
  - um segundo modelo de raciocinio hibrido cujo numero de chamadas de ferramenta se mantenha igual ou
    suba com /think
  owner: research
  last_reviewed: '2026-08-17'
  note: 'Medido em UM modelo (smollm3-3b), 96/96 tarefas, zero erro de infraestrutura: agregado 10.4%
    -> 25.0% (+14.6 pontos); tool_selection +75.0, hallucination +83.3, mas arguments -8.3 e error_recovery
    -33.3; chamadas de ferramenta 78->66 (caem, nao empatam). Passou por retratacao em duas etapas — 16
    tarefas (R-103 inicial) e 71 tarefas (R-103 atualizada) davam leituras diferentes da versao final
    de 96. HYPOTHESIS, nao CONJECTURE, porque a direcao (efeito misto, chamadas caem) se sustentou atraves
    de tres tamanhos de amostra crescentes sem inverter — mas continua sendo um unico modelo.'

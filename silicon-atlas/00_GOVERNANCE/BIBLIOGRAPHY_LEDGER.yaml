  org: Taalas
  year: 2026
  url: https://taalas.com/the-path-to-ubiquitous-ai/
  evidence_type: vendor_report
  ledger_ref: E-002
  claims_reported:
    - "demonstrador HC1 com Llama 3.1 8B implementado em hardware"
    - "17 mil tokens por segundo por usuario"
    - "TSMC 6 nm, 815 mm2, 53 bilhoes de transistores"
    - "contexto configuravel e suporte a LoRA"
  independently_reproduced: false
  usage_rule: >-
    PODE ser citado como demonstracao de existencia — a tese saiu do campo puramente hipotetico,
    e a preservacao de LoRA sustenta a leitura de arquitetura estratificada. NAO PODE ser citado

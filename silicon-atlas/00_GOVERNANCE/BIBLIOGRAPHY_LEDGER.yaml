    integralmente declarados, e o numero e do proprio fabricante.
  cross_check_performed: >-
    A area de ROM prevista por este repositorio para um modelo 8B entre 1.6 e 4 bits por peso cai
    na mesma ordem de grandeza dos 815 mm2 declarados. Consistencia de ordem de grandeza NAO e
    validacao, e nao promove o status desta fonte.

